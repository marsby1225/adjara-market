<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аджария Маркет — Объявления Батуми, Кобулети и Чакви</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Верхняя панель в стиле Авито */
        .top-bar {
            background: #292929;
            color: #ffffff;
            font-size: 13px;
            padding: 8px 0;
        }

        .top-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-links {
            display: flex;
            gap: 16px;
            color: #cccccc;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-fav-top {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-fav-top.active {
            color: #ff4d4f;
            font-weight: 700;
        }

        .btn-create {
            background: #00aaFF;
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-create:hover {
            background: #0095e0;
        }

        /* Основная шапка с логотипом и поиском */
        .main-header {
            padding: 16px 0 12px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 90;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 800;
            color: #000000;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .avito-dots {
            display: grid;
            grid-template-columns: repeat(2, 10px);
            gap: 3px;
        }

        .avito-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: block;
        }

        .dot-1 { background: #00aaFF; }
        .dot-2 { background: #00d25b; }
        .dot-3 { background: #965eeb; }
        .dot-4 { background: #ff4053; }

        /* Фирменная синяя рамка поиска Авито */
        .search-box {
            display: flex;
            flex: 1;
            min-width: 280px;
            border: 2px solid #00aaFF;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 10px 14px;
            font-size: 15px;
            outline: none;
        }

        .search-box select {
            border: none;
            border-left: 1px solid #e5e5e5;
            padding: 0 12px;
            font-size: 14px;
            color: #333333;
            background: #fafafa;
            outline: none;
            cursor: pointer;
        }

        .btn-search {
            background: #00aaFF;
            color: #ffffff;
            border: none;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-search:hover {
            background: #0095e0;
        }

        /* Категории-плитки */
        .categories-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 16px 0;
        }

        .cat-card {
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #222222;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
        }

        .cat-card:hover {
            background: #ebebeb;
        }

        .cat-card.active {
            background: #e6f7ff;
            border-color: #00aaFF;
            color: #0077b3;
        }

        /* Рекламный баннер */
        .promo-banner {
            background: #f2f9ff;
            border: 1px solid #cce9ff;
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .promo-banner span {
            font-size: 14px;
            color: #1f2937;
        }

        .promo-link {
            background: #00d25b;
            color: #ffffff;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .feed-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Сетка объявлений в стиле Авито */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px 16px;
            margin-bottom: 50px;
        }

        .item-card {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            transition: opacity 0.15s;
        }

        .photo-box {
            position: relative;
            width: 100%;
            height: 190px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
            margin-bottom: 8px;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-title {
            font-size: 16px;
            font-weight: 500;
            color: #0077ff;
            text-decoration: none;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .item-title:hover {
            color: #ff4053;
        }

        .item-price {
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 13px;
            color: #555555;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-meta {
            font-size: 12px;
            color: #888888;
            margin-bottom: 8px;
        }

        .tg-btn {
            display: inline-block;
            text-align: center;
            background: #00d25b;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-top: auto;
        }

        .tg-btn:hover {
            background: #00b84f;
        }

        /* Модальное окно подачи объявления */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 22px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #777777;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #00aaFF;
