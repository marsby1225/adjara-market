<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аджария Маркет — Объявления Батуми, Кобулети и Чакви</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Верхняя панель */
        .top-bar {
            background: #292929;
            color: #ffffff;
            font-size: 13px;
            padding: 8px 0;
        }

        .top-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-links {
            display: flex;
            gap: 16px;
            color: #cccccc;
        }

        /* Основная шапка */
        .main-header {
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 90;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 800;
            color: #000000;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .avito-dots {
            display: grid;
            grid-template-columns: repeat(2, 10px);
            gap: 3px;
        }

        .avito-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: block;
        }

        .dot-1 { background: #00aaff; }
        .dot-2 { background: #00d25b; }
        .dot-3 { background: #965eeb; }
        .dot-4 { background: #ff4053; }

        /* Поиск */
        .search-box {
            display: flex;
            flex: 1;
            min-width: 280px;
            border: 2px solid #00aaff;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 10px 14px;
            font-size: 15px;
            outline: none;
        }

        .search-box select {
            border: none;
            border-left: 1px solid #e5e5e5;
            padding: 0 12px;
            font-size: 14px;
            color: #333333;
            background: #fafafa;
            outline: none;
            cursor: pointer;
        }

        .btn-search {
            background: #00aaff;
            color: #ffffff;
            border: none;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-search:hover {
            background: #0095e0;
        }

        /* Главная кнопка добавления */
        .btn-create-main {
            background: #00aaff;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .btn-create-main:hover {
            background: #0095e0;
        }

        /* Панель формы размещения объявления */
        .ad-form-panel {
            display: none;
            background: #f8f9fb;
            border: 1px solid #e2e6ec;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .ad-form-panel.open {
            display: block;
        }

        .ad-form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .ad-form-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-close-form {
            background: transparent;
            border: none;
            font-size: 22px;
            line-height: 1;
            color: #666666;
            cursor: pointer;
            padding: 2px 6px;
        }

        .btn-close-form:hover {
            color: #000000;
        }

        .ad-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 13px;
            font-weight: 600;
            color: #222222;
        }

        .field input,
        .field select,
        .field textarea {
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            background: #ffffff;
            color: #000000;
            outline: none;
        }
