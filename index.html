<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аджария Маркет — Батуми, Кобулети, Чакви</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #000000;
            line-height: 1.4;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .top-bar {
            background: #292929;
            color: #ffffff;
            font-size: 13px;
            padding: 8px 0;
        }

        .top-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-links {
            display: flex;
            gap: 16px;
            color: #cccccc;
        }

        .btn-ads-top {
            background: #ffb703;
            border: none;
            color: #111111;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-ads-top:hover {
            background: #ffa500;
        }

        .main-header {
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 100;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
        }

        .dots {
            display: grid;
            grid-template-columns: repeat(2, 9px);
            gap: 3px;
        }

        .dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: block;
        }

        .d1 { background: #00aaff; }
        .d2 { background: #00d25b; }
        .d3 { background: #965eeb; }
        .d4 { background: #ff4053; }

        .search-box {
            display: flex;
            flex: 1;
            min-width: 260px;
            border: 2px solid #00aaff;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 10px 12px;
            font-size: 15px;
            outline: none;
        }

        .search-box select {
            border: none;
            border-left: 1px solid #e5e5e5;
            padding: 0 10px;
            font-size: 14px;
            background: #fafafa;
            outline: none;
            cursor: pointer;
        }

        .btn-search {
            background: #00aaff;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-create-main {
            background: #00aaff;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-create-main:hover,
        .btn-search:hover {
            background: #0090d9;
        }

        .panel {
            display: none;
            background: #f7f9fb;
            border: 1px solid #dce3ea;
            border-radius: 12px;
            padding: 18px;
            margin-top: 14px;
        }

        .panel.open {
            display: block;
        }

        .panel-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .panel-top h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-x {
            background: transparent;
            border: none;
            font-size: 24px;
            line-height: 1;
            color: #666666;
            cursor: pointer;
            padding: 0 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 13px;
            font-weight: 600;
        }

        .field input[type="text"],
        .field input[type="number"],
        .field select,
        .field textarea {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            background: #ffffff;
            outline: none;
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: #9ca3af;
        }

        .field input[type="file"] {
            border: 1px dashed #94a3b8;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            background: #ffffff;
            cursor: pointer;
        }

        .photo-preview-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .photo-preview {
            display: block;
            width: 68px;
            height: 52px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .field textarea {
            min-height: 70px;
            resize: vertical;
            margin-bottom: 12px;
        }

        .form-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-ok {
            background: #00c853;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-ok:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #1e293b;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-status {
            font-size: 13px;
            color: #0284c7;
            font-weight: 600;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .promo-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .promo-title {
            font-size: 15px;
            font-weight: 700;
        }

        .promo-price {
            font-size: 17px;
            font-weight: 800;
            color: #0077ff;
        }

        .promo-desc {
            font-size: 13px;
            color: #555555;
            margin-bottom: 6px;
        }

        .promo-link {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            background: #00aaff;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            margin-top: auto;
        }

        .tabs-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 16px 0;
            align-items: center;
        }

        .tab-btn {
            background: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #e0f2fe;
            border-color: #00aaff;
            color: #0369a1;
        }

        .tab-btn.fav-tab {
            background: #fef2f2;
            color: #dc2626;
            margin-left: auto;
        }

        .tab-btn.fav-tab.active {
            background: #ef4444;
            color: #ffffff;
            border-color: #dc2626;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
        }

        .btn-promo-inline {
            background: #fff8e6;
            color: #9a5b00;
            border: 1px solid #ffd166;
            padding: 7px 13px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-promo-inline:hover {
            background: #ffefc2;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px 16px;
            margin-bottom: 50px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #eceff3;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .img-wrap {
            position: relative;
            width: 100%;
            height: 190px;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
            margin-bottom: 8px;
        }

        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fav-heart {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.92);
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(17, 24, 39, 0.65);
            color: #ffffff;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .slider-btn.prev { left: 8px; }
        .slider-btn.next { right: 8px; }

        .img-counter {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(17, 24, 39, 0.72);
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
            z-index: 2;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #0077ff;
            margin-bottom: 4px;
        }

        .card-price {
            font-size: 18px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .card-city {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .card-tg {
            flex: 1;
            text-align: center;
            text-decoration: none;
            background: #00c853;
            color: #ffffff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-del {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-del:hover {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
        }

        .empty {
            grid-column: 1 / -1;
            color: #6b7280;
            padding: 24px 0;
            font-size: 15px;
