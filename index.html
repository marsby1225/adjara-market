<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аджария Маркет — Батуми, Кобулети, Чакви</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #000000;
            line-height: 1.4;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Верхняя панель */
        .top-bar {
            background: #292929;
            color: #ffffff;
            font-size: 13px;
            padding: 8px 0;
        }

        .top-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-links {
            display: flex;
            gap: 16px;
            color: #cccccc;
        }

        .btn-ads-top {
            background: #ffb703;
            border: none;
            color: #111111;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-ads-top:hover {
            background: #ffa500;
        }

        /* Шапка */
        .main-header {
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 100;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
        }

        .dots {
            display: grid;
            grid-template-columns: repeat(2, 9px);
            gap: 3px;
        }

        .dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: block;
        }

        .d1 { background: #00aaff; }
        .d2 { background: #00d25b; }
        .d3 { background: #965eeb; }
        .d4 { background: #ff4053; }

        .search-box {
            display: flex;
            flex: 1;
            min-width: 260px;
            border: 2px solid #00aaff;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }
