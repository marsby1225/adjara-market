<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аджария Маркет — Объявления Батуми, Кобулети и Чакви</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Верхняя панель */
        .top-bar {
            background: #292929;
            color: #ffffff;
            font-size: 13px;
            padding: 8px 0;
        }

        .top-bar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-links {
            display: flex;
            gap: 16px;
            color: #cccccc;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-create {
            background: #00aaff;
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-create:hover {
            background: #0095e0;
        }

        /* Основная шапка */
        .main-header {
            padding: 16px 0 12px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 90;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 800;
            color: #000000;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .avito-dots {
            display: grid;
            grid-template-columns: repeat(2, 10px);
            gap: 3px;
        }

        .avito-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: block;
        }

        .dot-1 { background: #00aaff; }
        .dot-2 { background: #00d25b; }
        .dot-3 { background: #965eeb; }
        .dot-4 { background: #ff4053; }

        /* Поиск */
        .search-box {
            display: flex;
            flex: 1;
            min-width: 280px;
            border: 2px solid #00aaff;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 10px 14px;
            font-size: 15px;
            outline: none;
        }

        .search-box select {
            border: none;
            border-left: 1px solid #e5e5e5;
            padding: 0 12px;
            font-size: 14px;
            color: #333333;
            background: #fafafa;
            outline: none;
            cursor: pointer;
        }

        .btn-search {
            background: #00aaff;
            color: #ffffff;
            border: none;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-search:hover {
            background: #0095e0;
        }

        /* Категории */
        .categories-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 16px 0;
        }

        .cat-card {
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #222222;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
        }

        .cat-card:hover {
            background: #ebebeb;
        }

        .cat-card.active {
            background: #e6f7ff;
            border-color: #00aaff;
            color: #0077b3;
        }

        .feed-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Сетка объявлений */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px 16px;
            margin-bottom: 50px;
        }

        .item-card {
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .photo-box {
            position: relative;
            width: 100%;
            height: 190px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
            margin-bottom: 8px;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-title {
            font-size: 16px;
            font-weight: 500;
            color: #0077ff;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .item-title:hover {
            color: #ff4053;
        }

        .item-price {
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 13px;
            color: #555555;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-meta {
            font-size: 12px;
            color: #888888;
            margin-bottom: 8px;
        }

        .tg-btn {
            display: inline-block;
            text-align: center;
            background: #00d25b;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-top: auto;
        }

        .tg-btn:hover {
            background: #00b84f;
        }

        .empty-msg {
            grid-column: 1 / -1;
            color: #777777;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="container top-bar-inner">
            <div class="top-links">
                <span>Батуми</span>
                <span>Кобулети</span>
                <span>Чакви</span>
            </div>
            <div class="top-actions">
                <button class="btn-create" id="create-ad-btn" type="button">+ Разместить объявление</button>
            </div>
        </div>
    </div>

    <header class="main-header">
        <div class="container header-row">
            <a href="#" class="brand" id="brand-reset">
                <div class="avito-dots">
                    <span class="dot-1"></span>
                    <span class="dot-2"></span>
                    <span class="dot-3"></span>
                    <span class="dot-4"></span>
                </div>
                Аджария Маркет
            </a>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Поиск по объявлениям...">
                <select id="city-select">
                    <option value="all">Все города</option>
                    <option value="Батуми">Батуми</option>
                    <option value="Кобулети">Кобулети</option>
                    <option value="Чакви">Чакви</option>
                </select>
                <button class="btn-search" id="search-btn" type="button">Найти</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="categories-row" id="categories-container">
            <button class="cat-card active" type="button" data-category="all">Все категории</button>
            <button class="cat-card" type="button" data-category="realty">Недвижимость</button>
            <button class="cat-card" type="button" data-category="auto">Авто</button>
            <button class="cat-card" type="button" data-category="tech">Электроника</button>
            <button class="cat-card" type="button" data-category="services">Услуги</button>
            <button class="cat-card" type="button" data-category="personal">Личные вещи</button>
        </div>

        <h2 class="feed-title">Свежие объявления</h2>
        <div class="grid" id="items-grid"></div>
    </div>

    <script>
        const fallbackImg = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260"><rect width="400" height="260" fill="#f0f2f5"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="16">Нет фото</text></svg>'
        );

        const items = [
            {
                id: 1,
                title: "Студия с видом на море в Новом Бульваре",
                price: "$450 / мес",
                category: "realty",
                city: "Батуми",
                desc: "Уютная студия с балконом и современным ремонтом. Есть всё необходимое для жизни.",
                image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80",
                tg: "https://t.me/"
            },
            {
                id: 2,
                title: "Toyota Prius 2018 в отличном состоянии",
                price: "$8,500",
                category: "auto",
                city: "Батуми",
                desc: "Гибрид, небольшой пробег, ухоженный салон.",
                image: "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=600&q=80",
                tg: "https://t.me/"
            },
            {
                id: 3,
                title: "MacBook Pro 16 M1 Pro 16/512GB",
                price: "$1,300",
                category: "tech",
                city: "Кобулети",
                desc: "Идеальное состояние, полный комплект. Батарея 92%.",
                image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80",
                tg: "https://t.me/"
            }
        ];

        const favorites = new Set();
        let selectedCategory = "all";

        function safeUrl(url, defaultUrl) {
            const trimmed = String(url || "").trim();
            return /^https?:\/\//i.test(trimmed) ? trimmed : defaultUrl;
        }

        function createCardElement(item) {
            const card = document.createElement("div");
            card.className = "item-card";

            const photoBox = document.createElement("div");
            photoBox.className = "photo-box";

            const img = document.createElement("img");
            img.src = item.image ? safeUrl(item.image, fallbackImg) : fallbackImg;
            img.alt = item.title;
            img.addEventListener("error", function handleImgError() {
                img.removeEventListener("error", handleImgError);
                img.src = fallbackImg;
            });

            const favBtn = document.createElement("button");
            favBtn.className = "fav-btn";
            favBtn.type = "button";
            const isFav = favorites.has(item.id);
            favBtn.textContent = isFav ? "❤️" : "♡";
            favBtn.setAttribute("aria-label", isFav ? "Убрать из избранного" : "Добавить в избранное");
            favBtn.addEventListener("click", () => toggleFav(item.id));

            photoBox.appendChild(img);
            photoBox.appendChild(favBtn);

            const titleEl = document.createElement("div");
            titleEl.className = "item-title";
            titleEl.textContent = item.title;

            const priceEl = document.createElement("div");
            priceEl.className = "item-price";
            priceEl.textContent = item.price;

            const descEl = document.createElement("div");
            descEl.className = "item-desc";
            descEl.textContent = item.desc;

            const metaEl = document.createElement("div");
            metaEl.className = "item-meta";
            metaEl.textContent = item.city;

            const tgLink = document.createElement("a");
            tgLink.className = "tg-btn";
            tgLink.href = safeUrl(item.tg, "https://t.me/");
            tgLink.target = "_blank";
            tgLink.rel = "noopener noreferrer";
            tgLink.textContent = "Написать продавцу";

            card.appendChild(photoBox);
            card.appendChild(titleEl);
            card.appendChild(priceEl);
            card.appendChild(descEl);
            card.appendChild(metaEl);
            card.appendChild(tgLink);

            return card;
        }

        function renderItems() {
            const grid = document.getElementById("items-grid");
            const searchQuery = document.getElementById("search-input").value.trim().toLowerCase();
            const cityQuery = document.getElementById("city-select").value;

            const filtered = items.filter((item) => {
                const matchesCat = selectedCategory === "all" || item.category === selectedCategory;
                const matchesCity = cityQuery === "all" || item.city === cityQuery;
                const matchesSearch =
                    !searchQuery ||
                    item.title.toLowerCase().includes(searchQuery) ||
                    item.desc.toLowerCase().includes(searchQuery);
                return matchesCat && matchesCity && matchesSearch;
            });

            grid.textContent = "";

            if (filtered.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty-msg";
                empty.textContent = "Объявлений не найдено";
                grid.appendChild(empty);
                return;
            }

            const fragment = document.createDocumentFragment();
            filtered.forEach((item) => {
                fragment.appendChild(createCardElement(item));
            });
            grid.appendChild(fragment);
        }

        function toggleFav(id) {
            if (favorites.has(id)) {
                favorites.delete(id);
            } else {
                favorites.add(id);
            }
            renderItems();
        }

        function resetFilters(e) {
            if (e) e.preventDefault();
            selectedCategory = "all";
            document.getElementById("search-input").value = "";
            document.getElementById("city-select").value = "all";
            document.querySelectorAll(".cat-card").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.category === "all");
            });
            renderItems();
        }

        document.getElementById("create-ad-btn").addEventListener("click", function () {
            window.open("https://t.me/", "_blank", "noopener,noreferrer");
        });

        document.getElementById("brand-reset").addEventListener("click", resetFilters);
        document.getElementById("search-input").addEventListener("input", renderItems);
        document.getElementById("city-select").addEventListener("change", renderItems);
        document.getElementById("search-btn").addEventListener("click", renderItems);

        document.getElementById("categories-container").addEventListener("click", (e) => {
            const btn = e.target.closest(".cat-card");
            if (!btn) return;
            document.querySelectorAll(".cat-card").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            selectedCategory = btn.dataset.category;
            renderItems();
        });

        renderItems();
    </script>
</body>
</html>
